openapi: 3.1.0
info:
  title: Citizen Services Portal API
  version: 0.2.0
  description: >
    Portal API (interface IF-01 in docs/interface_inventory.adoc), provided by the
    Backend Application and used by the Web Application. This version covers the
    health-assessment request workflow: creating a draft, submitting it, viewing
    its status directly or as a delegate, and taking a submitted request back to
    edit and resubmit it.


    Changes in 0.2.0 (all additive, see docs/api_evolution_strategy.adoc and
    ADR-0005): take-back endpoint, read-back of submitted content, revision
    numbers, and two new status values. Clients built for 0.1.0 keep working.


    Conventions (ADR-0003):

    - Versioning: the major version is part of the path (/api/v1). Changes within
      v1 are additive only; clients must ignore fields they do not recognize and
      must handle enum values they do not recognize (ADR-0005).

    - Identifiers: only random portal IDs (requestId, delegationId) appear in paths
      and parameters. The personal identification code, the Citizen ID, and the
      KVKR case reference are never used to look anything up.

    - Authentication: a session cookie created by the Backend Application after
      login through TARA. State-changing calls also need a CSRF token.

    - Authorization: checked by the Backend Application on every call
      (docs/access_control_matrix.adoc, docs/api_security_review.adoc). A request
      the caller may not see returns the same 404 response as a request that does
      not exist.

    - Errors: application/problem+json (RFC 9457) with a stable `code`. A code
      never changes meaning; new codes may be added.

    - Idempotency: a submission is identified by requestId plus revision.
      Repeating a call for the same requestId and revision never creates a second
      request or a second submission (docs/architecture.adoc, Workflow and
      messaging).


    Document upload is not part of this version.
  contact:
    name: Citizen Services Portal team
servers:
  - url: https://portal.example.ee/api/v1
    description: Placeholder host
tags:
  - name: Health-assessment requests
    description: Create, submit, take back, and view health-assessment requests.
  - name: Operations
    description: Operational endpoints that return no citizen data.

paths:
  /health:
    get:
      tags: [Operations]
      summary: Health check
      description: Liveness check for load balancers. Returns no data about requests or users.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The Backend Application is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /health-assessment-requests:
    post:
      tags: [Health-assessment requests]
      summary: Create or resume a draft request
      description: >
        Called when the citizen opens the health-assessment form. Creates a draft
        with a new random requestId. A citizen can have only one open draft, so if
        a draft already exists it is returned instead (200). Calling this twice
        therefore never creates two drafts. Drafts that are not submitted expire
        after 30 days. The draft always belongs to the caller; there is no way to
        create a request on someone else's behalf.
      operationId: createHealthAssessmentRequest
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "201":
          description: A new draft was created.
          headers:
            Location:
              description: URL of the new request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
        "200":
          description: The citizen's existing open draft is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Health-assessment requests]
      summary: List requests
      description: >
        Lists the caller's own requests. A delegate passes delegationId to list
        the requests of the person who granted the delegation; the delegation must
        be current and cover viewing status. The list contains status information
        only, never the submitted content or health information.
      operationId: listHealthAssessmentRequests
      security:
        - sessionCookie: []
      parameters:
        - name: delegationId
          in: query
          required: false
          description: Act on behalf of the grantor of this delegation.
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page's nextCursor.
          schema:
            type: string
      responses:
        "200":
          description: One page of requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthAssessmentRequest"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/DelegationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /health-assessment-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Health-assessment requests]
      summary: View a request's status
      description: >
        Returns the request and its current status. Allowed for the owner and for
        a delegate with a current delegation covering "view status". The submitted
        content is not included; the owner reads it from the submission endpoint.


        Before KRA has accepted the request, the status comes from the Portal
        Database. After that the Backend Application fetches the live status from
        KVKR. If KVKR does not answer in time, the response is still 200: it
        contains the last known status with statusSource SNAPSHOT and the time it
        was retrieved (scenario "TIS unavailable during health-related workflow",
        QAS-001). The response is returned within 5 seconds in every case.


        The ETag header carries the current revision, so clients can detect that
        the request was taken back or resubmitted in another tab.
      operationId: getHealthAssessmentRequest
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The request and its status.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
              examples:
                forwarded:
                  summary: Accepted by KRA, live status, take-back still possible
                  value:
                    requestId: 3f6c2a9e-7b1d-4c8e-9a52-1d0e8b7f4a21
                    type: HEALTH_ASSESSMENT
                    status: FORWARDED
                    revision: 1
                    takeBackAllowed: true
                    lastTakeBackOutcome: null
                    kvkrCaseReference: KVKR-2026-004817
                    externalStatus: Waiting for review at KRA
                    statusSource: KVKR_LIVE
                    statusRetrievedAt: "2026-10-23T10:42:05Z"
                    createdAt: "2026-10-20T08:15:00Z"
                    submittedAt: "2026-10-20T08:21:37Z"
                    pendingReason: null
                    actingFor: null
                kvkrUnavailable:
                  summary: KVKR not reachable, last known status shown
                  value:
                    requestId: 3f6c2a9e-7b1d-4c8e-9a52-1d0e8b7f4a21
                    type: HEALTH_ASSESSMENT
                    status: FORWARDED
                    revision: 1
                    takeBackAllowed: false
                    lastTakeBackOutcome: null
                    kvkrCaseReference: KVKR-2026-004817
                    externalStatus: Waiting for review at KRA
                    statusSource: SNAPSHOT
                    statusRetrievedAt: "2026-10-22T16:03:44Z"
                    createdAt: "2026-10-20T08:15:00Z"
                    submittedAt: "2026-10-20T08:21:37Z"
                    pendingReason: null
                    actingFor: null
                editing:
                  summary: Taken back, revision 2 being edited
                  value:
                    requestId: 3f6c2a9e-7b1d-4c8e-9a52-1d0e8b7f4a21
                    type: HEALTH_ASSESSMENT
                    status: EDITING
                    revision: 2
                    takeBackAllowed: false
                    lastTakeBackOutcome: COMPLETED
                    kvkrCaseReference: null
                    externalStatus: null
                    statusSource: PORTAL
                    statusRetrievedAt: null
                    createdAt: "2026-10-20T08:15:00Z"
                    submittedAt: null
                    pendingReason: null
                    actingFor: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /health-assessment-requests/{requestId}/submission:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Health-assessment requests]
      summary: Read the submitted content
      description: >
        Added in 0.2.0. Returns the content of the current revision, so the Web
        Application can pre-fill the form after a take-back. While the request is
        EDITING, this is the content of the revision that was taken back. Only the
        owner may read it; delegates get NOT_DELEGABLE because their delegation
        covers viewing status only.
      operationId: getHealthAssessmentSubmission
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The submitted content.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittedContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Health-assessment requests]
      summary: Submit or resubmit a request
      description: >
        Submits a draft, or resubmits a request that was taken back. Only the
        owner may submit; delegates get NOT_DELEGABLE.


        Idempotency: the requestId plus the revision in the body is the
        idempotency key, and PUT is used because repeating it has no further
        effect. The first successful call stores the submission, sets the status
        to RECEIVED, and returns 202. Forwarding to TIS and KVKR happens
        afterwards (accept first, forward afterwards). Any repeat with the same
        revision and body returns 202 with the same submission and is not
        forwarded again. A repeat with a different body returns 409
        SUBMISSION_CONFLICT; the stored submission is kept.


        Revisions: a draft is revision 1. Each completed take-back opens the next
        revision for editing. A resubmission must name the revision being edited.
        If the request has moved on in the meantime, for example it was
        resubmitted from another tab, the call returns 409 REVISION_OUTDATED.


        Compatibility: clients built for 0.1.0 do not send revision. A missing
        revision is treated as revision 1, so their first submission and its
        repeats behave exactly as before. Such responses carry a Deprecation
        header, because omitting revision will not be allowed in /api/v2.
      operationId: submitHealthAssessmentRequest
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "202":
          description: >
            The submission is stored (status RECEIVED or later). Returned for the
            first call and for identical repeats.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "409":
          description: >
            SUBMISSION_CONFLICT - this revision was already submitted with
            different content. REVISION_OUTDATED - the named revision is no longer
            the one being edited. REQUEST_NOT_EDITABLE - the request cannot be
            submitted in its current status, for example while a take-back is
            waiting for KRA. DRAFT_EXPIRED - the draft or taken-back request was
            not submitted within 30 days.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                conflict:
                  value:
                    type: https://portal.example.ee/problems/submission-conflict
                    title: Request already submitted
                    status: 409
                    code: SUBMISSION_CONFLICT
                    detail: This revision was already submitted with different content.
                    traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1E
                outdated:
                  value:
                    type: https://portal.example.ee/problems/revision-outdated
                    title: This request has changed
                    status: 409
                    code: REVISION_OUTDATED
                    detail: The request was changed elsewhere. Reload it before submitting.
                    traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1L
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /health-assessment-requests/{requestId}/take-back:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Health-assessment requests]
      summary: Take back a submitted request to edit it
      description: >
        Added in 0.2.0. Takes back the named revision so the citizen can edit and
        resubmit it. Only the owner may do this; delegates get NOT_DELEGABLE.
        Allowed only while takeBackAllowed is true on the request (ADR-0005).


        - If KRA has not accepted the request yet (RECEIVED or PENDING), the
          portal stops forwarding it, first checking with KVKR that a forward has
          not already arrived. The request becomes EDITING at the next revision
          and the call returns 200.

        - If KRA has accepted it (FORWARDED), the portal asks KVKR to release the
          case for amendment. The request becomes TAKE_BACK_REQUESTED and the call
          returns 202. When KRA answers, the request becomes EDITING
          (lastTakeBackOutcome COMPLETED) or returns to FORWARDED
          (lastTakeBackOutcome REFUSED_BY_KRA), and the citizen gets a
          notification to log in.


        Idempotency: the requestId plus the revision in the body is the key.
        Repeating a take-back of the same revision returns the current state
        without asking KVKR again. A request can be taken back at most 3 times
        (TAKE_BACK_LIMIT_REACHED).
      operationId: takeBackHealthAssessmentRequest
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeBackInput"
      responses:
        "200":
          description: Taken back. The request is EDITING at the next revision.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
        "202":
          description: KRA has been asked to release the case. The request is TAKE_BACK_REQUESTED.
          headers:
            ETag:
              $ref: "#/components/headers/RevisionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAssessmentRequest"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "409":
          description: >
            TAKE_BACK_NOT_ALLOWED - the request cannot be taken back now, for
            example KRA has started processing it or KVKR cannot be reached to
            confirm. REVISION_OUTDATED - the named revision is no longer current.
            TAKE_BACK_LIMIT_REACHED - the request has already been taken back 3
            times.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://portal.example.ee/problems/take-back-not-allowed
                title: This request can no longer be taken back
                status: 409
                code: TAKE_BACK_NOT_ALLOWED
                detail: KRA has started processing this request. Contact KRA to change it.
                traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1M
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-portal_session
      description: >
        Random session ID set by the Backend Application after a successful TARA
        login (HttpOnly, Secure, SameSite=Lax). The session holds the Citizen ID;
        the browser never sees it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Per-session token required on state-changing calls.

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      description: Random portal Request ID. Contains no personal data.
      schema:
        $ref: "#/components/schemas/Uuid"

  headers:
    RevisionETag:
      description: Current revision of the request, as a strong ETag, for example "2".
      schema:
        type: string
    Deprecation:
      description: >
        Sent only when the request omitted revision (a 0.1.0 client). Marks that
        behaviour as deprecated (RFC 9745).
      schema:
        type: string
    Sunset:
      description: >
        Sent together with Deprecation. Date after which omitting revision is no
        longer accepted, i.e. when /api/v1 is retired (RFC 8594).
      schema:
        type: string

  schemas:
    Uuid:
      type: string
      format: uuid

    RequestStatus:
      type: string
      description: >
        Portal-side status. DRAFT, RECEIVED, and EDITING are owned by the portal;
        PENDING means an external system has not answered yet and the portal will
        retry; FORWARDED means KRA has accepted the request and KVKR owns the case;
        TAKE_BACK_REQUESTED means the portal has asked KRA to release the case for
        editing. EDITING and TAKE_BACK_REQUESTED were added in 0.2.0. New values
        may be added within v1: clients must show an unrecognized value as "status
        not available, reload" and offer no actions.
      enum: [DRAFT, RECEIVED, PENDING, FORWARDED, TAKE_BACK_REQUESTED, EDITING]

    HealthAssessmentRequest:
      type: object
      required: [requestId, type, status, statusSource, createdAt]
      properties:
        requestId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          const: HEALTH_ASSESSMENT
        status:
          $ref: "#/components/schemas/RequestStatus"
        revision:
          type: integer
          minimum: 1
          description: >
            Added in 0.2.0. Revision being edited or last submitted. Starts at 1
            and increases by one with each completed take-back.
        takeBackAllowed:
          type: boolean
          description: >
            Added in 0.2.0. Whether the owner may take the request back now. False
            for delegates, after KRA has started processing, once the limit is
            reached, or when KVKR cannot be reached to check.
        lastTakeBackOutcome:
          type: [string, "null"]
          description: Added in 0.2.0. Result of the most recent take-back, if any.
          enum: [COMPLETED, REFUSED_BY_KRA, null]
        pendingReason:
          type: [string, "null"]
          description: Why the request is PENDING. Never contains health information.
          enum: [WAITING_FOR_HEALTH_INFORMATION_SYSTEM, WAITING_FOR_KVKR, null]
        kvkrCaseReference:
          type: [string, "null"]
          description: >
            KRA's case reference, shown so the citizen can quote it to KRA.
            Display only; never used to look up a request.
        externalStatus:
          type: [string, "null"]
          description: Case status text from KVKR, when the request is FORWARDED.
        statusSource:
          type: string
          description: >
            PORTAL - status from the Portal Database (before forwarding, or while
            editing). KVKR_LIVE - fetched from KVKR for this response. SNAPSHOT -
            last known status, because KVKR did not answer in time.
          enum: [PORTAL, KVKR_LIVE, SNAPSHOT]
        statusRetrievedAt:
          type: [string, "null"]
          format: date-time
          description: When the KVKR status was fetched. Always shown with a SNAPSHOT.
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
          description: When the current revision was submitted; null while it is being edited.
        actingFor:
          description: >
            Present when the caller is a delegate. Names the person represented,
            not their identifiers.
          oneOf:
            - type: "null"
            - type: object
              required: [delegationId, displayName]
              properties:
                delegationId:
                  $ref: "#/components/schemas/Uuid"
                displayName:
                  type: string

    SubmissionForm:
      type: object
      description: The fields the citizen fills in.
      properties:
        healthDataRetrievalAcknowledged:
          type: boolean
          const: true
          description: >
            The citizen confirms they understand that the portal will request the
            health information needed for the assessment from TIS.
        contactPhone:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{6,14}$"
          description: Optional phone number for KRA to contact the citizen.
        additionalInformation:
          type: [string, "null"]
          maxLength: 2000
          description: Free text for KRA. Should not contain health details.

    SubmissionInput:
      description: >
        Body of a submission. Only the listed fields are accepted; anything else,
        such as status or owner, is rejected with VALIDATION_FAILED.
      allOf:
        - $ref: "#/components/schemas/SubmissionForm"
        - type: object
          properties:
            revision:
              type: integer
              minimum: 1
              description: >
                Added in 0.2.0. Revision being submitted. Optional within v1 and
                treated as 1 when missing; required in v2.
      required: [healthDataRetrievalAcknowledged]
      unevaluatedProperties: false

    SubmittedContent:
      description: Content of one submitted or taken-back revision.
      allOf:
        - $ref: "#/components/schemas/SubmissionForm"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              minimum: 1
            submittedAt:
              type: [string, "null"]
              format: date-time

    TakeBackInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The submitted revision to take back. Must be the current revision.

    Problem:
      type: object
      description: RFC 9457 problem details with a stable code.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
          description: Human-readable explanation. Never contains personal data or data from the request.
        traceId:
          type: string
          description: Correlates the error with logs and audit events for helpdesk staff. Contains no personal data.
        errors:
          type: array
          description: Field-level problems for VALIDATION_FAILED.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string

    ErrorCode:
      type: string
      description: >
        Stable error codes. A code never changes meaning; new codes may be added
        within v1, so clients must handle unknown codes generically.
        REVISION_OUTDATED, REQUEST_NOT_EDITABLE, TAKE_BACK_NOT_ALLOWED, and
        TAKE_BACK_LIMIT_REACHED were added in 0.2.0.
      enum:
        - AUTHENTICATION_REQUIRED
        - ASSURANCE_LEVEL_TOO_LOW
        - CSRF_TOKEN_INVALID
        - NOT_DELEGABLE
        - REQUEST_NOT_FOUND_OR_NO_ACCESS
        - DELEGATION_NOT_FOUND_OR_INACTIVE
        - VALIDATION_FAILED
        - SUBMISSION_CONFLICT
        - DRAFT_EXPIRED
        - REVISION_OUTDATED
        - REQUEST_NOT_EDITABLE
        - TAKE_BACK_NOT_ALLOWED
        - TAKE_BACK_LIMIT_REACHED
        - RATE_LIMITED
        - INTERNAL_ERROR

  responses:
    Unauthenticated:
      description: AUTHENTICATION_REQUIRED - no valid session. The Web Application sends the user to TARA.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://portal.example.ee/problems/authentication-required
            title: Please log in
            status: 401
            code: AUTHENTICATION_REQUIRED
            traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1F
    Forbidden:
      description: >
        NOT_DELEGABLE - a delegate tried an action only the person themselves may
        do. ASSURANCE_LEVEL_TOO_LOW - the login method does not meet the required
        level. CSRF_TOKEN_INVALID - missing or wrong CSRF token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://portal.example.ee/problems/not-delegable
            title: This action can only be done by the person themselves
            status: 403
            code: NOT_DELEGABLE
            traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1G
    RequestNotFound:
      description: >
        REQUEST_NOT_FOUND_OR_NO_ACCESS - the request does not exist, or the caller
        is neither its owner nor a current delegate. Both cases return exactly this
        response, so the API does not reveal whether a request exists (R-015). The
        attempt is recorded in the Audit Store.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://portal.example.ee/problems/request-not-found-or-no-access
            title: Request not found or you do not have access to it
            status: 404
            code: REQUEST_NOT_FOUND_OR_NO_ACCESS
            traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1H
    DelegationNotFound:
      description: >
        DELEGATION_NOT_FOUND_OR_INACTIVE - the delegation does not exist, does not
        belong to the caller, has expired, has been revoked, or does not cover
        viewing status (R-014).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://portal.example.ee/problems/delegation-not-found-or-inactive
            title: This authorization is no longer active
            status: 404
            code: DELEGATION_NOT_FOUND_OR_INACTIVE
            traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1J
    ValidationFailed:
      description: VALIDATION_FAILED - the input does not match the schema. Field problems are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://portal.example.ee/problems/validation-failed
            title: Some fields are not valid
            status: 400
            code: VALIDATION_FAILED
            traceId: 01JB8Z6Q3W4X5Y6Z7A8B9C0D1K
            errors:
              - field: contactPhone
                code: PATTERN_MISMATCH
    RateLimited:
      description: RATE_LIMITED - too many requests from this session (SG-008).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: INTERNAL_ERROR - unexpected error. Safe to retry; submissions and take-backs are idempotent.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
